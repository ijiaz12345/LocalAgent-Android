name: Build and Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists and check size
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          SIZE=$(du -m "$APK_PATH" | cut -f1)
          echo "✅ APK size: ${SIZE}MB"
          if [ "$SIZE" -lt 10 ]; then
            echo "⚠️ APK too small, might be corrupted"
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Delete old releases
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          delete_release: true
          tag_name: v1.0.${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LocalAgent v1.0.${{ github.run_number }}
          files: ${{ env.APK_PATH }}
          body: |
            ✅ تم بناء التطبيق بنجاح!
            📦 الحجم يجب أن يكون 15-35 ميجابايت.
            ⚠️ احذف النسخة القديمة قبل التثبيت.
          draft: false
          prerelease: false
