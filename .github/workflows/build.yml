name: Build and Release APK

on:
  push:
    branches: [main]
  workflow_dispatch: # يسمح لك بتشغيل البناء يدوياً من GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # صلاحية إنشاء Release ورفع الملفات

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists and get its size
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "✅ APK found!"
            ls -lh "$APK_PATH"
            echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          else
            echo "❌ APK not found! Build might have failed silently."
            exit 1
          fi

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LocalAgent v1.0.${{ github.run_number }}
          files: ${{ env.APK_PATH }}
          body: |
            ✅ تم بناء التطبيق بنجاح!
            📦 حجم الملف يجب أن يكون بين 15 - 35 ميجابايت.
            ⚠️ ملاحظة: قم بإلغاء تثبيت النسخة القديمة من هاتفك قبل تثبيت هذه النسخة لتجنب تعارض التوقيعات.
          draft: false
          prerelease: false
